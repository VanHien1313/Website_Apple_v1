services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set a strong local SQL Server password}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - aura_mssql_data:/var/opt/mssql
volumes:
  aura_mssql_data:
