"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm --prefix frontend ci && npm --prefix frontend run build:api"
  publish = "frontend/dist-api"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/*"
  to = "https://aura-store-vn-api-8c89.indonesiacentral.cloudapp.azure.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health/*"
  to = "https://aura-store-vn-api-8c89.indonesiacentral.cloudapp.azure.com/health/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
